# Static analysis configuration.
#
# Base ruleset: Flutter's recommended lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated sources (*.g.dart, *.freezed.dart) are excluded from analysis.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true

  # ── riverpod_lint / custom_lint ──────────────────────────────────────────
  # ENABLE ONCE PUBLISHED VERSIONS SUPPORT THIS STACK.
  #
  # As of this writing there is no released `riverpod_lint` + `custom_lint`
  # pair compatible with the pinned `flutter_riverpod ^3.3.1` (-> riverpod
  # 3.2.1), `freezed_annotation ^3.1.0`, and the analyzer 12 toolchain:
  # `riverpod_lint 3.1.4-dev.1` requires `analyzer_plugin ^0.14.0`, which no
  # `custom_lint` release provides yet. Installing them would force a downgrade
  # of the core Riverpod/Freezed versions, so they are intentionally omitted.
  #
  # To enable later (no other code changes needed):
  #   flutter pub add dev:custom_lint dev:riverpod_lint
  # then uncomment:
  #
  # plugins:
  #   - custom_lint

linter:
  rules:
    prefer_single_quotes: true
    directives_ordering: true
    unawaited_futures: true
